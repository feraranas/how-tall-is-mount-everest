<!DOCTYPE html>
<html>
  <head>
    <link rel="stylesheet" href="styles.css">
    <title>MOUNTAINS</title>
    <script src="https://kit.fontawesome.com/8c1f754ca0.js" crossorigin="anonymous"></script>
    <link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>

    <div class="main-container">
      
      <!-- //////////////////////////////////////////////////////////////// -->
      <!-- METRONOMO FOR HEIGHT -->

            <div class="de"></div>
            <div class="ce"></div>
            <div class="mi"></div>
            <div class="dm"></div>

          </div>
      </div>

      <!-- MOUNTAINS -->
      <!-- MOUNT EVEREST SVG-->
      <div class="mountain-1">
        <div class="mount-everest"></div>

        <!-- fog reference: https://codepen.io/braedencraig/pen/dBVKzO?editors=1100 -->

          <div class="image01"></div>
          <div class="image02"></div>
        </div> -->

      <div class="mountain-2">
        <div class="k2"></div>

            <div class="back-row-toggle toggle active">BACK<br>ROW</div>
            <div class="single-toggle toggle">SINGLE</div>
          </div>
        </div> -->
      </div>

      <div class="mountain-3">
        <!-- KANGCHENJUNGA SVG -->
        <div class="kangchenjunga"></div>
      </div>

      <div class="mountain-4">
        <!-- LHOTSE SVG -->
        <div class="lhotse"></div>
      </div>

      <div class="mountain-5">
        <!-- MAKALU -->
        <div class="makalu"></div>
      </div>

      <div class="mountain-6">
        <!-- ACACONCAGUA -->
        <div class="acaconcagua"></div>
      </div>
      <div class="mountain-7">

        <div class="ojos-del-salado
        "></div>
      </div>
      <div class="mountain-8">
        <!-- MONTE PISSIS -->
        <div class="monte-pissis"></div>
      </div>

        <div class="huascaran"></div>
      </div>

        <div class="mount-denali"></div>

        <div class="kilimanjaro"></div>

        <div class="pico-orizaba"></div>

        <div class="volcan-malintzin"></div>

          <i class="fa-solid fa-info"></i>
        </div>
        <div class="cofre-perote"></div>

          <i class="fa-solid fa-info"></i>
        </div>
        <div class="cerro-negro-oax"></div>
      </div>
      <div class="mountain-25">
        <div class="mountain-25-title">NEVADO DE COLIMA</div>
        <div class="mountain-25-info">
          <i class="fa-solid fa-info"></i>
        </div>
        <div class="nevado-colima"></div>
      </div>


      <!-- //////////////////////////////////////////////////////////////// -->
      <!-- DIVERSE GRAPHICS CONTAINER -->
      <div class="container-inner">

        <!-- //////////////////////////////////////////////////////////////// -->
        <!-- GRAPHICS OF CLOUDS & FOG -->
        

        <!-- //////////////////////////////////////////////////////////////// -->
        <!-- INITIAL SCREEN ELEMENTS -->
        <!-- 1. BACKGROUND OFFROAD SVG-->
        <div class="background-offroad"></div>
        <!-- 2. FLOOR SVG -->
        <div class="floor"></div>
        <!-- 3. MAN SVG -->
        <div class="man-1"></div>
        <!-- 4. WOMAN SVG -->
        <div class="woman-1"></div>
        <!-- 5. ROCK BOULDER's SVG-->
        <div class="rock-boulder"></div>
        <div class="rock-boulder-2"></div>
        <!-- 6. TITLE -->
        <div class='title'>
          <h1 id="title">
            <span id="t1">MONTAÑAS DE </span><br><span class="mex">MÉX</span><span class="ico">ICO </span><span id="t2" class="lindo">LINDO </span><br><span id="t3">Y DEL </span><br><span>MUNDO</span>
          </h1>
          
          <!-- SCROLL UP TEXT -->
          <div class="scroll-up-text">
            Deslizate hacia arriba
            <i class="fa-solid fa-turn-up"></i>
          </div>  
        </div>
      </div>

      <!-- //////////////////////////////////////////////////////////////// -->
      <!-- END SCREEN ELEMENTS -->
      <div class="end-title slide-in">
        <h1 id="end-title">
          <span id="t1">MONTAÑAS DE </span><br><span class="mex">MÉX</span><span class="ico">ICO </span><span id="t2" class="lindo">LINDO </span><br><span id="t3">Y DEL </span><br><span>MUNDO</span>
        </h1>
        <!-- END TEXT -->
        <div class="end-text">Creado por Fernando Arana</div>  
      </div>

    </div> <!-- END CONTAINER FOR GRAPHICS -->

    <!-- JAVASCRIPT -->
    <script type="text/javascript" src="script.js"></script>
