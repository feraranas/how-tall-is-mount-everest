<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <link rel="stylesheet" href="./css/main-styles.css">
    <link rel="stylesheet" href="./css/components/cloud.css">
    <link rel="stylesheet" href="./css/components/mountain-title.css">
    <link rel="stylesheet" href="./css/components/info-tooltip.css">
    <link rel="stylesheet" href="./css/layout/cloud-placement.css">
    <link rel="stylesheet" href="./css/layout/mountain-placement.css">
    <link rel="stylesheet" href="./css/components/illustration.css">
    <link rel="stylesheet" href="./css/layout/illustration-placement.css">
    <link rel="stylesheet" href="./css/divider-ranges.css">
    <link rel="stylesheet" href="./css/animations.css">
    <link rel="stylesheet" media="screen and (min-width: 0px) and (max-width: 390px)" href="/css/media-0-390.css">
    <link rel="stylesheet" media="screen and (min-width: 391px) and (max-width: 428px)" href="/css/media-391-428.css">
    <link rel="stylesheet" media="screen and (min-width: 429px) and (max-width: 768px)" href="/css/media-429-768.css">
    <link rel="stylesheet" media="screen and (min-width: 769px) and (max-width: 1440px)" href="/css/media-769-1440.css">
    <link rel="stylesheet" media="screen and (min-width: 1441px) and (max-width: 1950px)" href="/css/media-1441-1950.css">
    <link rel="stylesheet" media="screen and (min-width: 1951px)" href="/css/media-1950.css">
    <title>MOUNTAINS</title>
    <script src="https://kit.fontawesome.com/8c1f754ca0.js" crossorigin="anonymous"></script>
    <link href='https://fonts.googleapis.com/css?family=Oswald' rel='stylesheet' type='text/css'>
  </head>
  <body>
    <!-- MAIN CONTAINER -->
    <div class="main-container">

      <!-- /////////////////////// METRONOMO /////////////////////////////// -->
      <!-- METRONOMO FOR HEIGHT -->
      <div class="metronomo-wrapper">
        <div class="metronomo"></div>
        <div class="metronomo-grid">
            <div class="un"></div>
            <div class="de"></div>
            <div class="ce"></div>
            <div class="mi"></div>
            <div class="dm"></div>
            <div class="me"></div>
          </div>
      </div>
      
      <!-- /////////////////////// DIVIDERS ////////////////////////////// -->
      <!-- DIVIDERS - MOUNTAIN RANGES -->
      <div class="dividers-container">
        <div class="divider three-thousander">
          Hikable three-thousander's
        </div>
      </div>

      <!-- /////////////////////// ANIMATIONS ////////////////////////////// -->
      <!-- STARS -->
      <div class="stars"></div>
      <!-- <div class="twinkleMask"></div> -->
      
      <!-- ASHES  -->
      <div class="ashes" id="canvascontainer">
        <canvas id="buffer"></canvas>
        <canvas id="canvas"></canvas>
      </div>
      <!-- CLOUDS -->
      <div class="clouds-container"></div>
      <!-- Generated from js/components/cloud.js into .clouds-container. -->

      <!-- /////////////////////// MOUNTAINS ////////////////////////////// -->
      <!-- Generated from js/mountainsData-script.js into #mountains-root. -->
      <div id="mountains-root"></div>

      <!-- /////////////////////// ILLUSTRATIONS /////////////////////////// -->

      <div class="illustrations"></div>
      <!-- Generated from js/components/illustration.js into .illustrations. -->

      <!-- ////////////////////// INITIAL SCREEN /////////////////////////// -->
      <!-- 1. BACKGROUND OFFROAD SVG-->
      <div class="background-offroad"></div>
      <!-- 2. FLOOR SVG -->
      <div class="floor"></div>
      <!-- 3. MAN SVG -->
      <div class="man-1"></div>
      <!-- 4. WOMAN SVG -->
      <div class="woman-1"></div>
      <!-- 5. ROCK BOULDER's SVG-->
      <div class="rock-boulder"></div>
      <div class="rock-boulder-2"></div>
      <!-- 6. TITLE -->
      <div class='title'>
        <h1 id="title">
          <span id="t1">MONTAÑAS DE </span><br><span class="mex">MÉX</span><span class="ico">ICO </span><span id="t2" class="lindo">LINDO </span><br><span id="t3">Y DEL </span><br><span>MUNDO</span>
        </h1>

        <!-- SCROLL UP TEXT -->
        <div class="scroll-up-text">
          Deslizate hacia arriba
          <i class="fa-solid fa-turn-up"></i>
        </div>
      </div>

      <!-- ////////////////////// END SCREEN ///////////////////////// -->
      <!-- END SCREEN ELEMENTS -->
      <div class="end-title slide-in">
        <h1 id="end-title">
          <span id="t1">MONTAÑAS DE </span><br><span class="mex">MÉX</span><span class="ico">ICO </span><span id="t2" class="lindo">LINDO </span><br><span id="t3">Y DEL </span><br><span>MUNDO</span>
        </h1>
        <!-- END TEXT -->
        <div class="end-text">Creado por Fernando Arana</div>
      </div>

    </div> <!-- END MAIN-CONTAINER -->

    <!-- JAVASCRIPT -->
    <script type="text/javascript" src="./js/scene.js"></script>
    <!-- Cloud DOM must exist before the drift engine queries `.cloud`. -->
    <script type="text/javascript" src="./js/components/cloud.js"></script>
    <script type="text/javascript" src="./js/cloudsParallax-script.js"></script>
    <script type="text/javascript" src="./js/script.js"></script>
    <script type="text/javascript" src="./js/ashesAnimation-script.js"></script>
    <script type="text/javascript" src="./js/rainAnimation-script.js"></script>
    <script type="text/javascript" src="./js/snowAnimation-script.js"></script>
    <!-- Component factories must load before the mountains renderer. -->
    <script type="text/javascript" src="./js/components/illustration.js"></script>
    <script type="text/javascript" src="./js/components/mountain.js"></script>
    <script type="text/javascript" src="./js/mountainsData-script.js"></script>
  </body>
</html>
