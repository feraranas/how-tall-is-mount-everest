# CI gates for the vanilla static site.
#
# - playwright: the full site suite. Chromium only (firefox/webkit stay
#   local-optional) and --workers=2 pinned: the suite serves via a
#   single-threaded `python3 -m http.server`, and unbounded workers
#   oversubscribe it into flaky timeouts.
# - storybook: builds the design-system catalog and runs the story render
#   smoke (every story must render non-empty with zero page errors).

name: ci

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  storybook:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build-storybook
      - run: npm run check-storybook
